
<!DOCTYPE html>
<html>
<head>
    <title>Meri Test Page</title>
    <style>
        body { font-family: Arial; text-align: center; margin: 50px; }
        img { width: 400px; border: 2px solid #ccc; transition: transform 0.3s; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; cursor: pointer; }
        input { padding: 10px; width: 300px; font-size: 16px; }
        .footer { margin-top: 2000px; color: gray; }
    </style>
</head>
<body>
    <h1>🌟 Meri Pyari Picture</h1>
    <img id="myImage" src="https://picsum.photos/400/300" alt="Random Picture">
    <br>
    <button id="likeBtn" onclick="document.getElementById('likeMsg').innerText='❤️ Aap ne Like kar diya!'">👍 Like</button>
    <p id="likeMsg" style="color:green;"></p>
    <br>
    <input id="commentBox" type="text" placeholder="Apna comment likhein...">
    <button id="submitBtn" onclick="alert('Comment submit ho gaya: ' + document.getElementById('commentBox').value)">Submit Comment</button>
    <p class="footer">Page ka end (yahan tak scroll karna hai)</p>
</body>
</html>
